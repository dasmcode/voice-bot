[project]
name = "voice-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "en-core-web-sm",
    "fastapi>=0.141.1",
    "google-cloud-storage>=3.14.1",
    "openai>=3.13.0",
    "openpyxl>=3.1.5",
    "presidio-analyzer>=2.2,<3",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.0,<3",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "spacy>=3.8,<3.9",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "pandas>=2.2.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
